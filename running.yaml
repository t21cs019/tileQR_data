# tileQR_data / running.yaml
#
# **いま走らせている計測**。COVERAGE.md の「計画の進捗」に `▶` で出る。
#
# --- 何を解決するか ---------------------------------------------------
#
# 進捗表は「計画にあるか」と「データが raw/ にあるか」の2値しか持っていない。
# そのため
#
#   - まだ流していない
#   - 流したが数日かかるのでまだ終わっていない
#   - 流したつもりで実はコマンドを打ち忘れていた
#   - 流したがジョブが落ちていた
#
# が全部おなじ `—` に見える。AOBA のバッチジョブや size16384 の走査は
# 数日かかるので、この区別がつかないと同じ計測を二重に投入するか、
# 落ちたジョブに気づかないまま放置することになる。
#
# --- なぜ plan.yaml と分けるか -----------------------------------------
#
# plan.yaml は COVERAGE.md の**分母**を決めるファイルで、変更はレビューしたい。
# 一方こちらは計測機から週に何度も書き換わる運用ログ。同じファイルに混ぜると、
# 「計測を1本流した」コミットと「計画の分母を変えた」コミットが見分けられなくなる。
#
# --- 運用 -------------------------------------------------------------
#
# 1. 計測コマンドを打ったら、ここに1エントリ足して push する
# 2. データが raw/ に入ったら、そのエントリを消す
#    （`make ingest` が「データがあるのに running のまま」の行を警告する）
#
# command は実際に打ったものをそのまま貼る。「どこまで打ったか」を後から
# 思い出すのが目的なので、清書しないこと。
#
# キー:
#   kind      qr_sweep | ssrfb | kernel_dtsmqr   （必須）
#   config    qr_sweep のとき。plan.yaml の config と同じ文字列
#   node      ssrfb / kernel_dtsmqr のとき
#   threads   スレッド数（必須）
#   sizes     走らせている size のリスト（必須）
#   since     打った日 YYYY-MM-DD（必須）
#   host      どのマシン / どのジョブから流したか
#   command   実際に打ったコマンド
#   note      補足（何本目か、前回落ちた理由、など）

version: 1

running: []
  # 書き方の例。実際に流したらコメントを外して使う。
  #
  # - kind: qr_sweep
  #   config: i5-7400_s1_smt-off
  #   threads: 4
  #   sizes: [1024, 2048]
  #   since: 2026-09-01
  #   host: i5-7400
  #   command: |
  #     ./run_sweep.sh --size 1024 --nb 32-512 --trials 5
  #     ./run_sweep.sh --size 2048 --nb 32-512 --trials 5
  #   note: サーマル対策で冷却を改善したうえでの再計測1本目
  #
  # - kind: ssrfb
  #   node: i5-7400
  #   threads: 1
  #   sizes: [1024, 2048, 4096, 8192]
  #   since: 2026-09-01
  #   host: i5-7400
  #   command: ./run_ssrfb.sh --threads 1 --nb 32-512
