# tileQR_data / running.yaml
#
# **いま走らせている計測**。COVERAGE.md の「計画の進捗」に `▶` で出る。
#
# --- 何を解決するか ---------------------------------------------------
#
# 進捗表は「計画にあるか」と「データが raw/ にあるか」の2値しか持っていない。
# そのため
#
#   - まだ流していない
#   - 流したが数日かかるのでまだ終わっていない
#   - 流したつもりで実はコマンドを打ち忘れていた
#   - 流したがジョブが落ちていた
#
# が全部おなじ `—` に見える。AOBA のバッチジョブや size16384 の走査は
# 数日かかるので、この区別がつかないと同じ計測を二重に投入するか、
# 落ちたジョブに気づかないまま放置することになる。
#
# --- なぜ plan.yaml と分けるか -----------------------------------------
#
# plan.yaml は COVERAGE.md の**分母**を決めるファイルで、変更はレビューしたい。
# 一方こちらは計測機から週に何度も書き換わる運用ログ。同じファイルに混ぜると、
# 「計測を1本流した」コミットと「計画の分母を変えた」コミットが見分けられなくなる。
#
# --- 運用 -------------------------------------------------------------
#
# 1. 計測コマンドを打ったら、ここに1エントリ足して push する
# 2. データが raw/ に入ったら、そのエントリを消す
#    （`make ingest` が「データがあるのに running のまま」の行を警告する）
#
# command は実際に打ったものをそのまま貼る。「どこまで打ったか」を後から
# 思い出すのが目的なので、清書しないこと。
#
# キー:
#   kind      qr_sweep | ssrfb | kernel_dtsmqr   （必須）
#   config    qr_sweep のとき。plan.yaml の config と同じ文字列
#   node      ssrfb / kernel_dtsmqr のとき
#   threads   スレッド数（必須）
#   sizes     走らせている size のリスト（必須）
#   since     打った日 YYYY-MM-DD（必須）
#   host      どのマシン / どのジョブから流したか
#   command   実際に打ったコマンド
#   note      補足（何本目か、前回落ちた理由、など）

version: 1

running:

  # --- 研究室のサーバ ---------------------------------------------------

  - kind: qr_sweep
    config: calc_s1_smt-off
    threads: 12
    sizes: [16384]
    since: 2026-09-01
    host: calc（研究室）
    note: 1ソケット固定。現在 2/5 本目

  - kind: qr_sweep
    config: ryzen7-5800x_s1_smt-on
    threads: 16
    sizes: [8192]
    since: 2026-09-01
    host: ryzen（研究室）
    note: size4096 は 2026-09-01 に完了して raw/ に入った

  - kind: qr_sweep
    config: epyc_s1_smt-on
    threads: 32
    sizes: [16384]
    since: 2026-09-01
    host: epyc（研究室）
    note: 現在 3/5 本目。1本ごとにジョブを投げている

  - kind: qr_sweep
    config: dogwood_s1_smt-off
    threads: 8
    sizes: [8192]
    since: 2026-09-01
    host: dogwood / i7-6900K（研究室）
    note: size4096 は 2026-08-30 に完了して raw/ に入った

  # --- 自宅の PC --------------------------------------------------------

  - kind: ssrfb
    node: i3-7100
    threads: 1
    sizes: [1024, 2048, 4096, 8192]
    since: 2026-08-31
    host: i3-7100（自宅）
    note: >
      i3-7100_s1_smt-off 計測の一環。plan.yaml 既定は trials=1 だが、
      今回はサイズ非依存という前提そのものを検証するため4サイズとも trials=5 で計測。
      taskset -c 0 で固定。beta が揃うか確認してから qr_sweep(smt-off) に進む。

  - kind: qr_sweep
    config: i5-7400_s1_smt-off
    threads: 4
    sizes: [1024, 2048, 4096, 8192]
    since: 2026-09-01
    host: i5-7400（自宅）
    note: >
      デュアルチャネル構成での再計測（curation.yaml の
      i5-7400-qr_sweep-memory-channels）。ssrfb（同じく threads=1 への
      撮り直し）は4サイズとも 2026-09-01 に完了して raw/ に入った。

  - kind: qr_sweep
    config: i7-7700_s1_smt-off
    threads: 4
    sizes: [16384]
    since: 2026-09-01
    host: i7-7700（自宅）
    note: >
      BIOS で SMT を切っての新規構成。既存の i7-7700_s1_smt-on（threads=8）
      とは別条件。size 1024/2048/4096/8192 は 2026-08-30〜31 に5本ずつ
      完了して raw/ に入ったが、**nb が 64 から始まっており計画の 32-512 に
      届いていない**（COVERAGE で `!`）。nb 32-60 を埋めるか、
      走査の開始点を 32 にして取り直すかは別途判断する

  - kind: qr_sweep
    config: ryzen5-7400f_s1_smt-off
    threads: 6
    sizes: [16384]
    since: 2026-09-01
    host: ryzen5-7400f（自宅）
    note: 1024-8192 は5本ずつ完了済み。残るは size16384 のみ
