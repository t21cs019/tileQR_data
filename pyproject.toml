[project]
name = "tileqr-data"
version = "0.1.0"
description = "タイルQR分解のパラメータチューニング研究における計測データと図の管理"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tileqr_data"]
