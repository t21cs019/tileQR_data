# tileQR_data / plan.yaml
#
# 計測計画。COVERAGE.md の「分母」はここが決める。
#
# plasma-perf 側の「計測進捗」テーブル（size / threads / nb / ib_min / step /
# trials / status / coverage）と同じ語彙で書く。両者が同じ規則で点数を数えるので、
# bench 側の coverage 列と COVERAGE.md の数字が一致する。
#
# grid が計測点の数え方を決める。ib の上限規則は測定種別で違うので必ず明示する:
#   half_nb        ib <= nb/2      … qr_sweep / ssrfb
#   nb_minus_step  ib <= nb - step … kernel_dtsmqr（カーネル単体）
# この2つを取り違えると計測点の期待値が2倍ずれる。
#
# ノードは計画に書かない。AOBA はバッチ計算機でジョブごとに割り当てが変わるし、
# 他は1構成1台なので、条件を分ける軸にならない。
# 「その条件を何本取りたいか」は trials だけで表す。

kinds:

  qr_sweep:
    label: 全体QR分解 (PLASMA dgeqrf) の nb×ib スイープ

    # どの CPU でも同じ計画。size 5種、nb 32-512。
    sizes: [1024, 2048, 4096, 8192, 16384]
    nb: [32, 512]
    trials: 5

    grid:
      ib_min: 8
      ib_step: 4
      ib_cap: half_nb
      # nb の刻みは size で変える。大きい行列は1点あたりの計測時間が延びるので、
      # 同じ密度で走らせると終わらない。
      nb_step_by_size:
        1024: 4
        2048: 4
        4096: 4
        8192: 8
        16384: 8
      # 刻みを粗くするとき ib も一緒に粗くなる（size 8192 は nb も ib も 8 刻み）。
      # ib_step を 4 に固定すると、大きい size で期待点数が倍近く過大になる。
      ib_step_follows_nb_step: true

    # config ごとにスレッド数だけ書く。size は上の sizes を全部展開する。
    targets:
      - {config: aoba-b_s2_smt-off,      threads: 128, sizes: [1024, 2048, 4096, 8192]}
      - {config: aoba-b_s1_smt-off,      threads: 64}
      - {config: calc_s2_smt-off,        threads: 24, sizes: [1024, 2048, 4096, 8192]}
      - {config: calc_s1_smt-off,        threads: 12}
      - {config: epyc_s1_smt-off,        threads: 32}
      - {config: i3-7100_s1_smt-on,      threads: 4, sizes: [1024, 2048, 4096, 8192]}
      - {config: i3-7100_s1_smt-off,     threads: 2, sizes: [1024, 2048, 4096, 8192]}
      - {config: i3-8100_s1_smt-off,     threads: 4}
      - {config: i5-7400_s1_smt-off,     threads: 4, sizes: [1024, 2048, 4096, 8192]}
      - {config: i5-8500_s1_smt-off,     threads: 6}
      - {config: i7-7700_s1_smt-on,      threads: 8, sizes: [1024, 2048, 4096, 8192]}
      - {config: i7-7700_s1_smt-off,     threads: 4, sizes: [1024, 2048, 4096, 8192]}
      - {config: ryzen5-7400f_s1_smt-on, threads: 12}
      - {config: ryzen5-7400f_s1_smt-off, threads: 6}
      - {config: i3-10100_s1_smt-off,    threads: 4, sizes: [1024, 2048, 4096, 8192]}
      - {config: dogwood_s1_smt-off,     threads: 8, sizes: [1024, 2048, 4096, 8192]}
      - {config: ryzen7-5800x_s1_smt-on, threads: 16, sizes: [1024, 2048, 4096, 8192]}

  ssrfb:
    label: ssrfb カーネル単体の nb×ib スイープ
    # 列に Time_sec を持つのはこの種別だけ。中身から判別できる唯一の測定。
    sizes: [1024, 2048, 4096, 8192]
    nb: [32, 512]
    # ssrfb は計測ツール自体が1回の呼び出しの中で50回計測して平均を出す。
    # defaults の trials: 5（外側でファイルを5本取る前提）は
    # 「反復なしだと単点に潰れる」問題への対策だが、ssrfb は1回の計測が
    # 既に50サンプルの平均なので同じ心配が要らない。ここで 1 に上書きする。
    trials: 1
    grid:
      nb_step: 4
      ib_min: 8
      ib_step: 4
      ib_cap: half_nb
    targets:
      - {node: calc,         threads: 1}
      - {node: dogwood,      threads: 1}
      - {node: epyc,         threads: 1}
      - {node: i3-10100,     threads: 1}
      - {node: i3-7100,      threads: 1}
      # 他の全ノードと同じ threads=1。2026-08-01 に threads=4 で誤って
      # 計測したものが一時あった（1台だけ条件が違うと機種間で beta を
      # 比べられない）。2026-08-31 に threads=1 で再計測済み。旧
      # threads=4 データは archive/quarantine/i5-7400_ssrfb_threads4_2026-08/
      # に退避してある。
      - {node: i5-7400,      threads: 1}
      - {node: i5-8500,      threads: 1}
      - {node: i7-7700,      threads: 1}
      - {node: ryzen,        threads: 1}
      - {node: ryzen5-7400f, threads: 1}

  kernel_dtsmqr:
    label: dtsmqr カーネル単体の nb×ib スイープ
    sizes: [4096]
    nb: [4, 350]
    trials: 5
    grid:
      nb_step: 2
      ib_min: 2
      ib_step: 2
      ib_cap: nb_minus_step
    # corei5-13400F は友人の PC で、2026-09 以降アクセスできない。
    # 手元の archive/attic/Full_search/intel_corei5_13400F/ が全ての在庫で、
    # th=16 は5トライアル揃っているが th=4 / th=8 は1本ずつしか無い。
    #
    # frozen を書いた条件は「これ以上データが来ない」の宣言。COVERAGE の
    # 進捗表に `x` が付き、「反復が計画に届かない条件」の件数から外れる
    # （行動できないものを数え続けると、その数字を見なくなるため）。
    # trials を 1 に下げて done 扱いにはしない。反復1本の nb_opt が
    # 主張に使えないことは変わらず、そこは 95% 帯の節が受け持つ。
    targets:
      - {node: corei5-13400F, threads: [16]}
      - {node: corei5-13400F, threads: [4, 8],
         frozen: "友人の PC。2026-09 以降アクセスできず、在庫は各1本のみ"}

# targets で個別に上書きできる既定値。
#
# trials を 5 にしてあるのは、反復なしだと 95% 性能帯が単点に潰れる条件が
# 出るため。ピークが「なだらかな山の頂上」ではなく「ノイズの中で偶然突き出した棘」
# になっている状態で、その nb_opt は研究の主張に使えない。
defaults:
  trials: 5
