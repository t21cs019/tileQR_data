# tileQR_data / running.yaml
#
# **いま走らせている計測**。COVERAGE.md の「計画の進捗」に `▶` で出る。
#
# --- 何を解決するか ---------------------------------------------------
#
# 進捗表は「計画にあるか」と「データが raw/ にあるか」の2値しか持っていない。
# そのため
#
#   - まだ流していない
#   - 流したが数日かかるのでまだ終わっていない
#   - 流したつもりで実はコマンドを打ち忘れていた
#   - 流したがジョブが落ちていた
#
# が全部おなじ `—` に見える。AOBA のバッチジョブや size16384 の走査は
# 数日かかるので、この区別がつかないと同じ計測を二重に投入するか、
# 落ちたジョブに気づかないまま放置することになる。
#
# --- なぜ plan.yaml と分けるか -----------------------------------------
#
# plan.yaml は COVERAGE.md の**分母**を決めるファイルで、変更はレビューしたい。
# 一方こちらは計測機から週に何度も書き換わる運用ログ。同じファイルに混ぜると、
# 「計測を1本流した」コミットと「計画の分母を変えた」コミットが見分けられなくなる。
#
# --- 運用 -------------------------------------------------------------
#
# 1. 計測コマンドを打ったら、ここに1エントリ足して push する
# 2. データが raw/ に入ったら、そのエントリを消す
#    （`make ingest` が「データがあるのに running のまま」の行を警告する）
#
# command は実際に打ったものをそのまま貼る。「どこまで打ったか」を後から
# 思い出すのが目的なので、清書しないこと。
#
# キー:
#   kind      qr_sweep | ssrfb | kernel_dtsmqr   （必須）
#   config    qr_sweep のとき。plan.yaml の config と同じ文字列
#   node      ssrfb / kernel_dtsmqr のとき
#   threads   スレッド数（必須）
#   sizes     走らせている size のリスト（必須）
#   since     打った日 YYYY-MM-DD（必須）
#   host      どのマシン / どのジョブから流したか
#   command   実際に打ったコマンド
#   note      補足（何本目か、前回落ちた理由、など）

version: 1

running:

  # --- 研究室のサーバ ---------------------------------------------------

  - kind: qr_sweep
    config: calc_s1_smt-off
    threads: 12
    sizes: [16384]
    since: 2026-09-01
    host: calc（研究室）
    note: 1ソケット固定。現在 2/5 本目

  - kind: qr_sweep
    config: ryzen7-5800x_s1_smt-on
    threads: 16
    sizes: [8192]
    since: 2026-09-01
    host: ryzen（研究室）
    note: size4096 は 2026-09-01 に完了して raw/ に入った

  # --- 学外（AOBA） -------------------------------------------------------

  - kind: qr_sweep
    config: aoba-b_s2_smt-off
    threads: 128
    sizes: [8192]
    since: 2026-09-05
    host: AOBA-B（NQSVジョブ、~/research/s2/）
    note: >
      aoba-b_s1_smt-off は size1024/2048/4096/8192/16384 全て解消済み
      （2026-09-05〜06）。s2 は size1024/2048 が解消済み。size8192 は
      5トライアル中1本（par019、jobid 271771）のみ取得済みで残り4本
      （r2-r5）は投入済み・未実行（.shのみ存在）。

  # --- 自宅の PC --------------------------------------------------------

  - kind: qr_sweep
    config: i3-7100_s1_smt-off
    threads: 2
    sizes: [8192]
    since: 2026-09-03
    host: i3-7100（自宅）
    note: >
      BIOS で SMT を切っての新規構成。既存の i3-7100_s1_smt-on（threads=4）
      とは別条件。size 1024/2048/4096 は 2026-09-05 に raw/ へ取り込み済み。
      残るは size8192 のみ。

  - kind: qr_sweep
    config: ryzen5-7400f_s1_smt-off
    threads: 6
    sizes: [16384]
    since: 2026-09-01
    host: ryzen5-7400f（自宅）
    note: 1024-8192 は5本ずつ完了済み。残るは size16384 のみ
