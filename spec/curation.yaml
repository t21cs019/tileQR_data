# tileQR_data / curation.yaml
#
# raw_data → raw で、**機械には判断できない取捨選択**。
#
# assemble.py が既に持っている除外（nb が1点だけのプローブ、より広い走査の
# 部分集合になっている周）はデータの形から決まるのでコードにある。ここに書くのは
# データを見ても分からない判断のほう:
#
#   - サーマルスロットリングで汚染された（計測中の室温は CSV に残らない）
#   - スレッド数が計画と違う条件で回してしまった
#   - この1点だけ後日ノイズに気づいて手で測り直した
#   - 古い計測のうち、この nb 区間だけは使える
#
# --- なぜ raw/ を手で消すのではいけないか -----------------------------
#
# raw/ は raw_data/ から `make assemble` で再生成できることが前提の
# ディレクトリ。手で消した除外も、手で書き換えた1点も、次の assemble で
# 黙って元に戻る。判断は再生成の**入力側**に無ければ保たない。
#
# 実際 i7-7700 / ryzen のコールドスタート点の手直しは raw/ を直接編集して
# あり、raw_data 側には異常値が残ったままだった。下の replace はそれを
# 再現可能な形に置き直したもの。
#
# 散文（なぜ・どう測り直すか）は TODO_REMEASURE.md にある。
# ここはそれを機械が守れる形にしたもの。両方が要る。片方だけだと、
# 理由の分からない除外か、誰も守らない約束のどちらかになる。
#
# --- 書き方 -----------------------------------------------------------
#
# match のキー（指定したものすべてに一致した対象に効く）
#
#   トライアル単位  kind / node / config / threads / size / src / trial
#   行単位          nb / ib      ← これを書くと該当行だけに効く（＝部分的に使う）
#
# nb / ib は `32`（値）、`[32, 64]`（区間）、`[32, 40, 48]`（3つ以上なら集合）。
# src は raw_data 側のファイル名。glob 可。
#
# 未知のキーと空の match は読み込み時にエラーにする。`kind` を `kinds` と
# 書き間違えたルールが黙って全件を除外するのが一番こわいため。
#
# 当たらなくなったルールは assemble が「未使用」として報告する。
# 再計測が済んだら消すこと。消し忘れると新しい計測が黙って除外され続ける。

version: 1

# --- raw/ に上げないもの ----------------------------------------------

exclude:

  # 2026-09-05: i5-7400 の qr_sweep メモリチャネル問題（旧
  # i5-7400-qr_sweep-memory-channels）と ssrfb threads 取り違え（旧
  # i5-7400-ssrfb-threads）は、AOBA-B s1 の隔離作業に合わせて
  # curation.yaml の src 列挙ではなくディレクトリ移動方式に統一した。
  # データは archive/quarantine/i5-7400_single_channel_2026-06/ と
  # archive/quarantine/i5-7400_ssrfb_threads4_2026-08/ に退避済み
  # （raw_data からは既に居ない。raw_data 側の該当ルールは不要になった）。

  - id: ryzen7-5800x-qr_sweep-nb404-512-merged
    match:
      kind: qr_sweep
      node: ryzen
      src:
        - ryzen_size2048_nb404-512_t5_20260901_015640.csv
        - ryzen_size4096_nb404-512_t5_20260901_030638.csv
    since: 2026-09-04
    reason: >
      学部時代データ（nb 32-400、migrate.py 生成、raw_data 上は
      Ryzen7-5800X_16_{2048,4096}_trial{1-5}.csv）の nb 404-512 の穴を
      埋めるために計測したもの。assemble.py は migrate.py 側の元ファイルを
      読まないため両者を自動連結できず（TODO_REMEASURE.md 参照）、
      2026-09-01 に raw/ 上で手作業により
      ryzen_size{2048,4096}_t16_nb32-512_{stamp}_r{1-5}.csv へ連結済み。
      この raw_data ファイル自体は連結後も残っているので、除外しないと
      make assemble のたびに単独の nb404-512 トライアルとして raw/ に
      復活し、ryzen7-5800x_s1_smt-on の size2048/4096 が「同じ計測を
      二重に取り込んでいる」と validate に怒られる（2026-09-04 に発生）。
    remeasure: >
      不要。連結済みの nb32-512 が正。この rule は raw_data の掃除（削除）を
      するまでの暫定措置。

# --- 別ファイルの値で置き換えるもの ------------------------------------
#
# match には nb / ib が要る。トライアル丸ごとの置換は、連結の出所が
# JOINS.md から追えなくなるので許していない。
#
# 数値そのものをここに直書きしないのは、「どのファイルの何行をどう畳んだ値か」
# が失われるため。畳み方は agg と drop_first に書く。

replace:

  - id: i7-7700-ssrfb-coldstart
    match:
      kind: ssrfb
      node: i7-7700
      size: 1024
      nb: 32
      ib: 8
    from:
      file: i7-7700_s1_smt-on/i7-7700_manual_ssrfb_nb32_ib8.csv
      agg: mean
    since: 2026-08-30
    reason: >
      走査の1点目だけ Time_sec が周辺の数十〜数百倍に跳ねる
      コールドスタート性ノイズ（元の値は 0.146 GFlops、周辺は9.8以上）。
      該当点のみ手動で5回再計測したところ 10.1〜10.7 GFlops で安定したため、
      その算術平均で置き換える。

  - id: ryzen-ssrfb-coldstart
    match:
      kind: ssrfb
      node: ryzen
      size: 1024
      nb: 32
      ib: 8
    from:
      file: ryzen7-5800x_s1_smt-on/ryzen_manual_ssrfb_nb32_ib8.csv
      agg: mean
      # 手動再計測でも1回目だけ Time_sec が約10倍に跳ねた（0.53 GFlops、
      # 残り9回は5.5〜6.2）。同じコールドスタート性ノイズの再現とみて捨てる。
      drop_first: 1
    since: 2026-08-30
    reason: >
      i7-7700 と同じコールドスタート性ノイズ。該当点のみ手動で10回再計測し、
      1回目を除いた9回の算術平均で置き換える。
