configs:
  # キー = raw/qr_sweep/ 直下のディレクトリ名
  # 命名規則: {arch}_s{sockets_used}_smt-{on|off}
  #
  # sockets_used は「物理搭載数」ではなく「実際に使用したソケット数」。
  # numactl --cpunodebind でピン留めした場合は、ピン留め後の値を書く。
  #
  # memory_channels / turbo は「メモリチャネル構成が最適 nb そのものを変える」
  # 「ターボの有無で再現性が崩れる」ため必ず埋める。unknown のまま残っている
  # ものは COVERAGE.md の「交絡要因が未確認の構成」に出る。
  #
  # cores_effective（2026-09-05 追加）: 実際に使用した物理コア数。
  # `threads`（起動したスレッド数、plan.yaml 側にある）とは別概念として持たせる。
  # 通常は cores_effective = threads / (smt: on ? 2 : 1) だが、これは
  # 「割り当てたコア数と起動したスレッド数が一致している」という前提の上に
  # 成り立つ式であって、その前提自体が崩れることがある
  # （aoba-b_s1_smt-off が 2026-06〜09 まさにこれで、numactl の
  # cpunodebind が NPS4 で 16 コアしか掴んでおらず、smt:off でも
  # threads=64 と cores_effective=16 が一致しなかった。検証は
  # archive/quarantine/aoba-b_s1_oversubscribed_2026-06/README.md）。
  # この区別が無かったことが見落としの直接原因なので、実効コア数は
  # 計算式に頼らずここに明示の値として持つ。

  aoba-b_s2_smt-off:
    arch: aoba-b
    sockets_used: 2
    smt: off
    memory_channels: 8          # per socket。EPYC 7702 の最大構成と同値。要実機確認
    turbo: unknown              # 要確認
    numactl: null
    nps: NPS4                   # 計算ノードの構成。ログインノード(NPS1)と混同しないこと
    cores_effective: 128
    scheduler: nqsv
    queue: lx
    note: 両ソケット使用。threads=128 の系列。

  aoba-b_s1_smt-off:
    arch: aoba-b
    sockets_used: 1
    smt: off
    memory_channels: 8
    turbo: unknown
    numactl: "--cpunodebind=0-3 --membind=0"   # 2026-09-05 訂正。旧: --cpunodebind=0
    nps: NPS4                   # 計算ノードの構成。ログインノード(NPS1)と混同しないこと
    cores_effective: 64
    scheduler: nqsv
    queue: lx
    note: >
      片ソケット（NPS4 の4ノード分 = 64コア）にピン留め。threads=64 の系列。

      2026-09-05 訂正: 2026-06〜09 に計測した分は `--cpunodebind=0` を使っており、
      NPS4 環境では NUMA ノード 0 = 16 コアしか掴んでいなかった（64スレッドを
      16コアに載せた4倍オーバーサブスクリプション）。par057 での検証
      （--cpunodebind=0 のピーク 316.2 GFlops、正しい --cpunodebind=0-3 で
      461.0 GFlops）で発覚。該当データは `archive/quarantine/aoba-b_s1_oversubscribed_2026-06/`
      へ退避し、numactl を `--cpunodebind=0-3` に訂正して `docs/TODO_REMEASURE.md`
      に再計測を積んだ。詳細は quarantine 側の README。

  # --- 研究室サーバ ---

  calc_s2_smt-off:
    arch: xeon-silver-4214
    sockets_used: 2
    smt: off                    # cpus.toml threads_per_core = 1
    memory_channels: unknown    # 要確認
    turbo: unknown
    numactl: null
    cores_effective: 24
    note: threads=24（2ソケット全24コア）。

  calc_s1_smt-off:
    arch: xeon-silver-4214
    sockets_used: 1
    smt: off
    memory_channels: unknown    # 要確認
    turbo: unknown
    numactl: "--cpunodebind=0 --membind=0"
    cores_effective: 12
    note: 片ソケットにピン留め。threads=12（1ソケット全12コア）の系列。

  epyc_s1_smt-off:
    arch: epyc-7543
    sockets_used: 1
    smt: off
    memory_channels: unknown
    turbo: unknown
    numactl: null
    cores_effective: 32
    note: threads=32（1ソケット全32コア）。SMT 無効。

  # --- 自宅デスクトップ群 ---

  i3-7100_s1_smt-on:
    arch: kabylake-i3-7100
    sockets_used: 1
    smt: on
    memory_channels: unknown    # 自宅機は DIMM を融通し合っていた。要確認
    # サーマルドリフトあり、再計測対象（TODO_REMEASURE.md）。
    turbo: unknown
    numactl: null
    cores_effective: 2
    note: threads=4（2コア x SMT）。

  i3-7100_s1_smt-off:
    arch: kabylake-i3-7100
    sockets_used: 1
    smt: off
    memory_channels: 2          # 実測で確定（2026-08-31、dmidecode）。下の note を読むこと
    turbo: off                  # intel_pstate no_turbo=1 を実測（2026-08-31）
    numactl: null
    cores_effective: 2
    note: >
      threads=2（2コア、SMT無効）。sysfs（/sys/devices/system/cpu/smt/control）で無効化して計測。

      実機は ChannelA-DIMM1（4GB DDR4、定格2667MT/s）/ ChannelB-DIMM1（4GB DDR4、
      定格2400MT/s）のデュアルチャネル構成。定格が異なるため Configured Memory Speed
      は両方とも2400MT/sに揃っている（dmidecodeで実測、2026-08-31）。
      i3-7100_s1_smt-on 計測時（2026-06〜07）の turbo/memory_channels は未確認のまま
      なので、この smt-off データと直接比較する際は要注意（TODO_REMEASURE.md 参照）。

  i3-8100_s1_smt-off:
    arch: coffeelake-i3-8100
    sockets_used: 1
    smt: off
    memory_channels: unknown    # 自宅機は DIMM を融通し合っていた。要確認
    # 形状が同コア数群の外れ値、再計測対象（TODO_REMEASURE.md）。
    turbo: unknown
    numactl: null
    cores_effective: 4
    note: threads=4（4コア、SMT なし）。

  i5-7400_s1_smt-off:
    arch: kabylake-i5-7400
    sockets_used: 1
    smt: off
    memory_channels: 1         # 実測で確定（2026-08-31）。下の note を読むこと
    turbo: on                  # intel_pstate no_turbo=0、負荷時 3.30 GHz を実測
    numactl: null
    cores_effective: 4
    note: >
      threads=4。**現在 raw/ にあるデータはシングルチャネルで計測されており無効。**
      全サイズ再計測の対象（TODO_REMEASURE.md）。再計測後は memory_channels: 2 に直す。

      実機は 4GB DDR4-2400 single rank x2 を ChannelA-DIMM1 / ChannelB-DIMM1 に
      搭載できる構成（dmidecode -t 17）。6月の計測時は1枚だけ挿さっていた。
      DIMM を抜き差しして両構成で計測した結果、6月の値がシングル側で再現した
      （10点の比が平均 1.003）。デュアル化の効果は nb 依存で nb=32 +5.9%、
      nb=448 +21.4%。最良 nb も 232 → 320 と動く。
      詳細: studies/i5-7400_memory_channel/

      実測値（OMP_NUM_THREADS=4）:
        1ch  TRIAD 15.53 / COPY 15.10 / READ 16.69 GB/s、READ は3スレッドで飽和
        2ch  TRIAD 29.44 / COPY 29.05 / READ 24.78 GB/s、4スレッドでも未飽和
        全コア AVX2 クロック 3.30 GHz（両構成とも）、PL1 65W/tau 8s、PL2 81W
        18分連続負荷でドリフト -0.1%、throttle 0件、パッケージ温度 73℃ で飽和

  i5-8500_s1_smt-off:
    arch: coffeelake-i5-8500
    sockets_used: 1
    smt: off
    memory_channels: unknown    # dual channel のはず。nb* に影響するため要確認
    # 自宅機は DIMM を融通し合っていた。未点検。spotcheck.py で検証すること。
    turbo: unknown
    numactl: null
    cores_effective: 6
    note: threads=6。

  i7-7700_s1_smt-on:
    arch: kabylake-i7-7700
    sockets_used: 1
    smt: on
    memory_channels: unknown    # 自宅機は DIMM を融通し合っていた。要確認
    # 未点検。spotcheck.py で検証すること。
    turbo: unknown
    numactl: null
    cores_effective: 4
    note: threads=8（4コア x SMT）。

  i7-7700_s1_smt-off:
    arch: kabylake-i7-7700
    sockets_used: 1
    smt: off
    memory_channels: unknown    # 自宅機は DIMM を融通し合っていた。要確認
    turbo: unknown
    numactl: null
    cores_effective: 4
    note: threads=4（4コア、SMT 無効）。BIOS で SMT を切って計測。

  ryzen5-7400f_s1_smt-on:
    arch: zen4-ryzen5-7400f
    sockets_used: 1
    smt: on
    memory_channels: unknown    # 自宅機は DIMM を融通し合っていた。要確認
    # 未点検。spotcheck.py で検証すること。
    turbo: unknown
