# tileQR_data / machines.yaml
#
# 三段構成:
#   architectures … CPU そのものの諸元（不変）
#   configs       … 計測時の構成（ディレクトリ名がそのままキー）
#   nodes         … 物理ノード → どの architecture か
#
# raw/qr_sweep/ 配下のディレクトリ名は configs のキーと 1:1 で対応する。
# ディレクトリ名は短く保ち、詳細はすべてここに書く。
#
# --- ダッシュボード (plasma-perf) との対応 ------------------------------
#
# 向こうの cpus.toml / sources.toml が CPU 諸元とソース定義を持つ。
# 諸元が食い違うと同じ計測を別物として扱うことになるので、
# 各 architecture に `dashboard_cpu`（cpus.toml のキー）、
# 各 node に `source_key`（sources.toml のキー）を書いて対応を明示する。
#
# 注意: sources.toml のキーはアンダースコア（i3_6100）だが、
# ここの node 名はハイフン（i3-6100）でなければならない。
# ファイル名の node 部分が `[A-Za-z0-9-]+` に限られているため
# （io.FILENAME_RE）。アンダースコアを使うと validate.py が弾く。
#
# smt_capable  … ハードウェアが SMT を持つか（不変）
# smt_default  … cpus.toml の threads_per_core から読める「計測時の設定」
#                 実際に使った値は configs 側の smt が優先。
#
# display_order … COVERAGE.md の表で機材を並べる番号。小さいほど上。
#   10番台 = 学外（AOBA） / 20番台 = 大学のサーバ / 30番台〜 = 自宅
#   自宅は CPU の世代が新しいほど小さい番号（同世代内は上位ティアが先）。
#   config も node も architecture 経由でこの番号に解決されるので、
#   qr_sweep の表と ssrfb の表が同じ順で並ぶ。無い機材は最後尾（99）。
#   アルファベット順にしないのは、読み手が探すのは「どの設置場所の機材か」
#   であって名前の綴りではないため。

architectures:

  aoba-b:
    cpu: AMD EPYC 7702
    display_order: 11           # 学外（AOBA）
    dashboard_cpu: epyc_7702
    vendor: amd
    microarch: zen2
    sockets_physical: 2
    physical_cores_total: 128
    physical_cores_per_socket: 64
    smt_capable: true
    smt_default: off          # cpus.toml threads_per_core = 1
    numa_nodes_total: 8       # 2 socket x NPS4。計算ノードの構成。
    # 注意（2026-09-05）: ログインノードは NPS1（lscpu.txt 保存分はこちら）。
    # 計算ノードと構成が違うので、lscpu.txt を計算ノードの諸元と誤読しないこと。
    # この取り違えが aoba-b_s1_smt-off の 16 コア発覚を遅らせた
    # （configs.aoba-b_s1_smt-off の note、archive/quarantine/aoba-b_s1_oversubscribed_2026-06/ 参照）。
    l1d_kb_per_core: 32
    l2_kb_per_core: 512
    l3_mb_per_ccx: 16
    cores_per_ccx: 4
    l3_mb_per_socket: 256     # 16 CCX x 16 MB。cpus.toml と一致すること
    # L3 共有単位は CCX（Zen 系）。shared-tile cache model の C_unit に対応。
    l3_sharing_unit: ccx

