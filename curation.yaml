# tileQR_data / curation.yaml
#
# raw_data → raw で、**機械には判断できない取捨選択**。
#
# assemble.py が既に持っている除外（nb が1点だけのプローブ、より広い走査の
# 部分集合になっている周）はデータの形から決まるのでコードにある。ここに書くのは
# データを見ても分からない判断のほう:
#
#   - サーマルスロットリングで汚染された（計測中の室温は CSV に残らない）
#   - スレッド数が計画と違う条件で回してしまった
#   - この1点だけ後日ノイズに気づいて手で測り直した
#   - 古い計測のうち、この nb 区間だけは使える
#
# --- なぜ raw/ を手で消すのではいけないか -----------------------------
#
# raw/ は raw_data/ から `make assemble` で再生成できることが前提の
# ディレクトリ。手で消した除外も、手で書き換えた1点も、次の assemble で
# 黙って元に戻る。判断は再生成の**入力側**に無ければ保たない。
#
# 実際 i7-7700 / ryzen のコールドスタート点の手直しは raw/ を直接編集して
# あり、raw_data 側には異常値が残ったままだった。下の replace はそれを
# 再現可能な形に置き直したもの。
#
# 散文（なぜ・どう測り直すか）は TODO_REMEASURE.md にある。
# ここはそれを機械が守れる形にしたもの。両方が要る。片方だけだと、
# 理由の分からない除外か、誰も守らない約束のどちらかになる。
#
# --- 書き方 -----------------------------------------------------------
#
# match のキー（指定したものすべてに一致した対象に効く）
#
#   トライアル単位  kind / node / config / threads / size / src / trial
#   行単位          nb / ib      ← これを書くと該当行だけに効く（＝部分的に使う）
#
# nb / ib は `32`（値）、`[32, 64]`（区間）、`[32, 40, 48]`（3つ以上なら集合）。
# src は raw_data 側のファイル名。glob 可。
#
# 未知のキーと空の match は読み込み時にエラーにする。`kind` を `kinds` と
# 書き間違えたルールが黙って全件を除外するのが一番こわいため。
#
# 当たらなくなったルールは assemble が「未使用」として報告する。
# 再計測が済んだら消すこと。消し忘れると新しい計測が黙って除外され続ける。

version: 1

# --- raw/ に上げないもの ----------------------------------------------

exclude:

  - id: i5-7400-qr_sweep-memory-channels
    match:
      kind: qr_sweep
      node: i5-7400
    since: 2026-09-01
    reason: >
      2026-06-24 分はシングルチャネルで計測されていた。DIMM を1枚抜くと
      当時の値が再現する（代表10点の比が平均 1.003、範囲 0.979-1.016）。
      クロック・ターボ・熱条件は両構成で同一（3.30 GHz、throttle 0件）
      なので、変数はチャネル構成だけ。デュアル化の効果は nb 依存で
      nb=32 が +5.9%、nb=448 が +21.4%。一様なオフセットではないため
      後から補正できず、最良 nb も 232 -> 320 と動く。
      size 8192 のみ 2026-06-30 の別セッションで形状指標は健全に見えるが、
      当日の DIMM 構成を裏付ける記録が無いのであわせて落とす。
      根拠は studies/i5-7400_memory_channel/。
    remeasure: >
      デュアルチャネル構成で size 1024/2048/4096/8192 を各5反復。
      machines.yaml の memory_channels を計測前に確認すること。

  - id: i5-7400-ssrfb-threads
    match:
      kind: ssrfb
      node: i5-7400
    since: 2026-09-01
    reason: >
      threads=4 で計測されているが、ssrfb は他の全ノード（calc / dogwood /
      epyc / i3-10100 / i5-8500 / i7-7700 / ryzen / ryzen5-7400f）を
      threads=1 で測っている。NoFlush は libgomp にリンクされていて
      OMP_NUM_THREADS が効き、しかも効き方が nb で大きく違う
      （th4/th1 が nb=64 で 0.92、nb=384 で 3.09）。曲線の形が別物なので、
      ここから出した nb* は他機と比較できない。bench ssrfb の既定は
      threads=1 で、ファイル名に th4 が付くのは --threads 4 を明示した
      ときだけなので、この1台だけの取り違え。
      メモリ構成の影響は受けていない（NoFlush はキャッシュ常駐で回るため
      DRAM に触らない。デュアル構成での再計測との比が 1.00±0.01）。
      plan.yaml の i5-7400 が threads: 4 になっていたのは、この計測に
      合わせて後から書いたもので、計画側が間違っていた。
    remeasure: >
      threads=1 で size 1024/2048/4096/8192 を1本ずつ。
      （ssrfb は1回の呼び出しの中で50回計測して平均するため trials: 1 でよい）
      COVERAGE の size8192 の `!`（step=8 で格子51%・計画26%）も
      同じキャンペーンで解消する。

# --- 別ファイルの値で置き換えるもの ------------------------------------
#
# match には nb / ib が要る。トライアル丸ごとの置換は、連結の出所が
# JOINS.md から追えなくなるので許していない。
#
# 数値そのものをここに直書きしないのは、「どのファイルの何行をどう畳んだ値か」
# が失われるため。畳み方は agg と drop_first に書く。

replace:

  - id: i7-7700-ssrfb-coldstart
    match:
      kind: ssrfb
      node: i7-7700
      size: 1024
      nb: 32
      ib: 8
    from:
      file: i7_7700/i7-7700_manual_ssrfb_nb32_ib8.csv
      agg: mean
    since: 2026-08-30
    reason: >
      走査の1点目だけ Time_sec が周辺の数十〜数百倍に跳ねる
      コールドスタート性ノイズ（元の値は 0.146 GFlops、周辺は9.8以上）。
      該当点のみ手動で5回再計測したところ 10.1〜10.7 GFlops で安定したため、
      その算術平均で置き換える。

  - id: ryzen-ssrfb-coldstart
    match:
      kind: ssrfb
      node: ryzen
      size: 1024
      nb: 32
      ib: 8
    from:
      file: benchmark_ryzen/ryzen_manual_ssrfb_nb32_ib8.csv
      agg: mean
      # 手動再計測でも1回目だけ Time_sec が約10倍に跳ねた（0.53 GFlops、
      # 残り9回は5.5〜6.2）。同じコールドスタート性ノイズの再現とみて捨てる。
      drop_first: 1
    since: 2026-08-30
    reason: >
      i7-7700 と同じコールドスタート性ノイズ。該当点のみ手動で10回再計測し、
      1回目を除いた9回の算術平均で置き換える。
